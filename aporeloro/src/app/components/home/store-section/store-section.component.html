<section class="featured-products">
  <h2 class="section-title">Nuestra Merch</h2>

  <div class="product-grid">
    <div class="product-card"
         *ngFor="let product of products"
         (click)="navigateToShop(product.id)"
         (mouseenter)="toggleProductImage(product, true)"
         (mouseleave)="toggleProductImage(product, false)">

      <div class="product-image-container">
        <img [src]="product.primaryImage"
             [alt]="product.name"
             class="primary-image">
        <img [src]="product.hoverImage"
             [alt]="product.name"
             class="hover-image">
      </div>

      <div class="product-info">
        <div class="visible-info">
          <h3>{{product.name}}</h3>
        </div>
        <div class="hidden-colors">
          <span *ngFor="let color of product.colors"
                [style.background-color]="color"
                class="color-option"></span>
        </div>
      </div>
    </div>
  </div>
</section>
