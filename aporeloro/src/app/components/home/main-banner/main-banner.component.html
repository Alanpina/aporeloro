<div class="main-banner" id="top">
  <div class="image-container">
    <img src="assets/images/BanerIndex.jpg" alt="Imagen Principal" />
    <div class="overlay">
      <div class="text-content">
        <ng-container *ngIf="isMobileSize; else desktop">

          <p>{{ p2 }}</p>

      </div>
    </div>
  </div>
</div>
