<div class="product-card">
  <div class="product-image-container">
    <div class="image-wrapper">
      <div class="hover-content">
        <ul>
          <li>
            <a (click)="openModal(content)"><i class="fa fa-eye"></i></a>
          </li>
        </ul>
      </div>
      <img
        [src]="'assets/images/products/' + imageName"
        [alt]="text"
        class="product-image"
      />
    </div>
    <div class="product-badge" *ngIf="isNew">Nuevo</div>
  </div>
  <div class="product-info">
    <h3 class="product-title">{{ text }}</h3>
    <p class="product-category">{{ category }}</p>
    <div class="product-price">
      <span class="current-price">${{ price.toLocaleString() }}</span>
      <span class="original-price" *ngIf="originalPrice"
        >${{ originalPrice.toLocaleString() }}</span
      >
    </div>
    <div class="product-colors" *ngIf="colors && colors.length > 0">
      <span
        class="color-option"
        *ngFor="let color of colors"
        [style.background-color]="color"
        [class.selected]="selectedColor === color"
      ></span>
    </div>
  </div>
</div>
