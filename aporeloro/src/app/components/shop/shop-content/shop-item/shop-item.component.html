<div class="product-card">
  <div class="product-image-container">
    <div class="image-wrapper" (click)="openModal(content)">
      <!-- Botón móvil en centro inferior -->
      <button class="mobile-eye-button" (click)="$event.stopPropagation(); openModal(content)">
        <i class="fa fa-eye"></i>
      </button>

      <!-- Hover content para desktop (oculto en móviles) -->
      <div class="hover-content">
        <ul>
          <li>
            <a (click)="$event.stopPropagation(); openModal(content)">
              <i class="fa fa-eye"></i>
            </a>
          </li>
        </ul>
      </div>

      <img
        [src]="'assets/images/products/' + imageName"
        [alt]="text"
        class="product-image"
      />
    </div>
    <div class="product-badge" *ngIf="isNew">Nuevo</div>
  </div>

  <div class="product-info">
    <h3 class="product-title">{{ text }}</h3>
    <p class="product-category">{{ category }}</p>
    <div class="product-price">
      <span class="current-price">${{ price.toLocaleString() }}</span>
      <span class="original-price" *ngIf="originalPrice">
        ${{ originalPrice.toLocaleString() }}
      </span>
    </div>
    <div class="product-colors" *ngIf="colors && colors.length > 0">
      <span
        class="color-option"
        *ngFor="let color of colors"
        [style.background-color]="color"
        [class.selected]="selectedColor === color"
      ></span>
    </div>
  </div>
</div>

<!-- Modal -->
<ng-template #content let-modal>
  <div class="modal-header">
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="modal.dismiss('Cross click')"
    >×</button>
  </div>

  <div class="modal-body">
    <div class="modal-content-wrapper">
      <!-- Columna de imágenes - SOLO 2 IMÁGENES DEL MISMO TAMAÑO -->
      <div class="modal-images-column">
        <div class="modal-images-container">
          <!-- Primera imagen -->
          <div class="modal-image-item">
            <img
              [src]="'assets/images/products/' + imageName"
              [alt]="text"
              class="modal-image"
            >
          </div>
          <!-- Segunda imagen -->
          <div class="modal-image-item">
            <img
              [src]="'assets/images/products/' + imageName"
              [alt]="text + ' - vista 2'"
              class="modal-image"
            >
          </div>
          <!-- Puedes agregar más imágenes aquí si necesitas -->
        </div>
      </div>

      <!-- Columna de información -->
      <div class="modal-info-column">
        <!-- Información del producto -->
        <div class="product-details">
          <h4 class="modal-product-title">{{ text }}</h4>

          <div class="price-container">
            <span class="price-current">${{ price.toLocaleString() }}</span>
          </div>

          <!-- Colores disponibles -->
          <div *ngIf="colors && colors.length > 0" class="colors-section">
            <label class="colors-label">Colores disponibles:</label>
            <div class="colors-container">
              <span
                *ngFor="let color of colors"
                class="color-chip"
                [style.background]="color"
                [class.selected]="selectedColor === color"
                (click)="selectedColor = color"
              ></span>
            </div>
          </div>

          <!-- Frases del producto -->
          <div class="phrases-section">
            <div class="phrases-list">
              <div
                *ngFor="let phrase of (phrases.length > 0 ? phrases : getDefaultPhrases()); let i = index"
                class="phrase-item"
              >
                <span>{{ phrase }}</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Botón de Instagram -->
        <div class="instagram-section">
          <div class="instagram-content">
            <label class="instagram-label">Comprar Via</label>
            <button
              type="button"
              class="btn btn-instagram"
              (click)="contactViaInstagram()"
              [disabled]="isContacting"
            >
              <i class="fab fa-instagram" *ngIf="!isContacting"></i>
              <i class="fas fa-spinner fa-spin" *ngIf="isContacting"></i>
              {{ isContacting ? 'Preparando mensaje...' : 'Contactar por Instagram' }}
            </button>
            <small class="instagram-note">
              * Se copiará un mensaje automático y se abrirá la app
            </small>
          </div>
        </div>
      </div>
    </div>
  </div>
</ng-template>
